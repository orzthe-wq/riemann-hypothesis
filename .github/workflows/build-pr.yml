name: Build PR
run-name: "${{ inputs.mode == 'fragment' && format('Fragment {0} on {1}', inputs.fragment_commit, inputs.fragment_runner) || inputs.mode == 'quick-check' && 'Quick check' || inputs.mode == 'native-proof' && 'Proof shard' || 'Build PR' }} #${{ github.event.pull_request.number || inputs.pr_number }} ${{ github.event.pull_request.head.sha || 'manual' }}"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Full candidate build or an operator-pinned ready proof batch
        type: choice
        default: build
        options:
          - build
          - native-proof
          - quick-check
          - fragment
      quick_head:
        description: Optional immutable PR head selected by the small-runner scheduler
        type: string
        default: ''
      quick_runner:
        description: Registered small host for a bounded changed-module diagnostic
        type: choice
        default: ryzen-5900x
        options:
          - ryzen-5900x
          - i9-12900ks
          - gcp-small
      proof_seed_sha256:
        description: Content SHA of the reviewed proof seed in the fixed public cache
        type: string
        default: ''
      pr_number:
        description: Pull request whose proposed merge result should be built
        type: number
        required: true
      fragment_commit:
        description: "Fragment: commit SHA, or 'SHA BASE HEAD DATE PR' for an rh-buildq PR merge"
        type: string
        default: ''
      fragment_targets:
        description: "Fragment: module names, gz:<base64>, https://URL or git:REF:PATH (plans take #CHUNK)"
        type: string
        default: ''
      fragment_runner:
        description: "Fragment: runner label in the RiemannHypothesisBuild group"
        type: string
        default: ''
      fragment_jobs:
        description: "Fragment: LEAN_NUM_THREADS (empty: all cores)"
        type: string
        default: ''
      fragment_publish:
        description: "Fragment: publish the result to the shared cache"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

# Preserve running builds and their partial caches when a PR advances. Distinct
# heads may use separate available runners; repeat events for one head coalesce.
# Manual dispatches serialize separately because they resolve the head at runtime.
concurrency:
  group: ${{ inputs.mode == 'fragment' && format('rh-fragment-{0}', github.run_id) || inputs.mode == 'quick-check' && format('rh-quick-{0}', inputs.quick_runner) || format('rh-build-pr-{0}-{1}', github.event.pull_request.number || inputs.pr_number, inputs.mode == 'native-proof' && format('native-proof-{0}', inputs.proof_seed_sha256) || github.event.pull_request.head.sha || 'manual') }}
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ inputs.mode != 'native-proof' && inputs.mode != 'quick-check' && inputs.mode != 'fragment' && (github.event_name == 'workflow_dispatch' || vars.RH_CI_MANUAL_ONLY != 'true') }}
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.resolve.outputs.candidate }}
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Resolve immutable candidate using trusted code
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--pr "$PR_NUMBER" --output request.json)
          if [[ -n "$PR_HEAD" ]]; then args+=(--head "$PR_HEAD"); fi
          python3 scripts/ci-prepare.py resolve "${args[@]}"
          python3 - <<'PY'
          import json, os
          request = json.load(open('request.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('candidate=' + request['expected']['candidate_head'], file=output)
              print('reuse=' + request.get('reuse_from', ''), file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-input
          path: request.json
          overwrite: true
          retention-days: 7

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.reuse == '' }}
    runs-on:
      group: RiemannHypothesisBuild
      # Full builds never consume the small diagnostic pool.
      labels: rh-build
    timeout-minutes: 1440
    steps:
      - name: Clear disposable outputs from earlier jobs
        run: rm -rf -- staging identity rh-ci-build-*
      - name: Checkout trusted harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts
            lakefile.toml
            lake-manifest.json
            lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Checkout candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-input
          path: identity
      - name: Prepare trusted toolchain and public caches
        run: |
          umask 077
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          python3 trusted/scripts/ci-prepare.py prepare --trusted trusted --candidate candidate \
            --state "${RH_CI_STATE_DIR:-$HOME/.local/share/riemann-build-state}" \
            --request identity/request.json --output identity/paths.json
      - name: Build candidate
        id: build
        continue-on-error: true
        run: |
          umask 077
          tail -n 0 -F staging/build.log 2>/dev/null &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          set +e
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.load(open('identity/paths.json'))
          jobs = int(os.environ.get('RH_CI_JOBS', min(8, os.cpu_count() or 1)))
          total_kib = int(next(line for line in open('/proc/meminfo') if line.startswith('MemTotal:')).split()[1])
          memory = int(os.environ.get('RH_CI_MEMORY_GIB', max(4, total_kib // 1024**2 * 4 // 5)))
          args = ['python3', 'trusted/scripts/ci-build.py', '--candidate', 'candidate',
                  '--packages', paths['packages'], '--output', 'staging', '--jobs', str(jobs),
                  '--memory-gib', str(memory), '--baseline-cache', paths['baseline_cache'],
                  '--baseline-manifest', paths['baseline_manifest'], '--baseline-map', paths['baseline_map']]
          if paths['latest_map']:
              args += ['--cache-map', paths['latest_map']]
          result = subprocess.run(args)
          code = result.returncode if result.returncode >= 0 else 128 - result.returncode
          subprocess.run(['python3', 'trusted/scripts/ci-prepare.py', 'expected', '--request',
                          'identity/request.json', '--exit-code', str(code), '--output', 'identity/expected.json'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('exit_code=' + str(code), file=output)
          raise SystemExit(code)
          PY
          code=$?
          exit "$code"
      - name: Upload trusted build identity
        if: ${{ always() && steps.build.outputs.exit_code != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-request
          path: |
            identity/request.json
            identity/expected.json
          overwrite: true
          retention-days: 7
      - name: Upload completed modules, including partial failed builds
        id: cache_upload
        if: ${{ always() && hashFiles('staging/receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-cache
          path: |
            staging/receipt.json
            staging/outputs.jsonl
            staging/module-manifest.jsonl.gz
            staging/artifacts/*.ltar
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Release successful raw work after durable upload
        if: ${{ always() && steps.cache_upload.outcome == 'success' && steps.build.outputs.exit_code == '0' }}
        env:
          CACHE_ARTIFACT_ID: ${{ steps.cache_upload.outputs.artifact-id }}
          CACHE_ARTIFACT_DIGEST: ${{ steps.cache_upload.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          checkpoint = json.load(open('staging/work-checkpoint.json'))['checkpoint']
          subprocess.run(['python3', 'trusted/scripts/ci-build.py', '--release-work', checkpoint,
                          '--uploaded-artifact-id', os.environ['CACHE_ARTIFACT_ID'],
                          '--uploaded-artifact-digest', os.environ['CACHE_ARTIFACT_DIGEST']], check=True)
          PY
      - name: Remove disposable build outputs
        if: ${{ always() }}
        run: rm -rf -- staging identity rh-ci-build-*
      - name: Report build result
        if: ${{ always() }}
        env:
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          test -n "$BUILD_EXIT" || exit 1
          exit "$BUILD_EXIT"

  proof_plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'native-proof' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      candidate: ${{ steps.plan.outputs.candidate }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: tools/ci_native
      - name: Fetch the fixed, content-addressed proof seed
        env:
          SEED_SHA: ${{ inputs.proof_seed_sha256 }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          test "$PR_NUMBER" = "$(python3 -c 'import json; print(json.load(open("trusted/tools/ci_native/proof-policy.json"))["pr_number"])')"
          python3 trusted/tools/ci_native/fetch_proof_seed.py --seed-sha256 "$SEED_SHA" --output seed
      - id: plan
        env:
          SEED_SHA: ${{ inputs.proof_seed_sha256 }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 trusted/tools/ci_native/prepare_proofs.py --seed seed/seed.json --seed-sha256 "$SEED_SHA" \
            --registry trusted/tools/ci_native/proof-runners.json --output control \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --workflow-sha "$WORKFLOW_SHA" \
            --producer trusted/tools/ci_native/proof_producer.py --worklist seed/proof-worklist.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          matrix = json.loads(Path('control/matrix.json').read_text())
          seed = json.loads(Path('seed/seed.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(matrix, separators=(',', ':')), file=output)
              print('candidate=' + seed['snapshot']['git_commit'], file=output)
              print('has_work=' + str(bool(matrix['include'])).lower(), file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: control
          retention-days: 3

  proof_worker:
    needs: proof_plan
    if: ${{ needs.proof_plan.outputs.has_work == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.proof_plan.outputs.matrix) }}
    runs-on:
      group: RiemannHypothesisBuild
      labels: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    env:
      PROOF_CONTROL_ROOT: ${{ github.workspace }}/proof-controls/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lease_id }}
      PROOF_OUTPUT_ROOT: ${{ github.workspace }}/proof-returned/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lease_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            tools/ci_native
            scripts
            lakefile.toml
            lake-manifest.json
            lean-toolchain
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.proof_plan.outputs.candidate }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proof-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_CONTROL_ROOT }}
      - name: Fetch authenticated dependency deltas and prepare public stock caches
        env:
          ID: ${{ matrix.id }}
          SEED_SHA: ${{ inputs.proof_seed_sha256 }}
          ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          umask 077
          export PATH="$HOME/.elan/bin:$PATH"
          python3 trusted/tools/ci_native/fetch_proof_seed.py --seed-sha256 "$SEED_SHA" --output "$PROOF_CONTROL_ROOT/$ID" --inputs-only
          python3 trusted/tools/ci_native/prepare_host.py --trusted trusted --candidate candidate \
            --control "$PROOF_CONTROL_ROOT/$ID" --state "${RH_CI_STATE_DIR:-$HOME/.local/share/riemann-build-state}" \
            --runner "$ACTUAL_RUNNER"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lease = json.loads((Path(os.environ['PROOF_CONTROL_ROOT']) / os.environ['ID'] / 'lease.json').read_text())
          subprocess.run(['python3', 'trusted/tools/ci_native/build_backend.py', '--operation', 'native-proof',
                          '--toolchain', lease['worker']['toolchain_root']], check=True)
          PY
      - name: Run only the explicit ready proof lease
        env:
          ID: ${{ matrix.id }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTUAL_RUNNER: ${{ runner.name }}
          CPUS: ${{ matrix.cpus }}
          MEMORY: ${{ matrix.memory_mib }}
          SECONDS_LIMIT: ${{ matrix.timeout_seconds }}
        run: |
          umask 077
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if [[ ! -S "$XDG_RUNTIME_DIR/bus" ]]; then
            echo "The dedicated runner account has no systemd user bus at $XDG_RUNTIME_DIR/bus; check its user manager and loginctl linger setting." >&2
            exit 1
          fi
          systemd-run --user --wait --collect --pipe --unit="rh-proof-${RUN_ID}-${ATTEMPT}-${ID}" \
            -p "CPUQuota=$((CPUS*100))%" -p "MemoryMax=${MEMORY}M" -p MemorySwapMax=0 \
            -p TasksMax=16384 -p LimitSTACK=infinity -p "RuntimeMaxSec=$((SECONDS_LIMIT+120))" \
            python3 "$PWD/trusted/tools/ci_native/launch.py" --root "$PWD/candidate" \
            --control "$PROOF_CONTROL_ROOT/$ID" --output "$PROOF_OUTPUT_ROOT" \
            --producer "$PWD/trusted/tools/ci_native/proof_producer.py" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --runner "$ACTUAL_RUNNER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lease_id }}
          path: ${{ env.PROOF_OUTPUT_ROOT }}/returned
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3

  quick_resolve:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'quick-check' }}
    runs-on: ubuntu-latest
    outputs:
      runnable: ${{ steps.resolve.outputs.runnable }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - id: resolve
        name: Resolve a source-pinned small-runner diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          SMALL_RUNNER: ${{ inputs.quick_runner }}
          QUICK_HEAD: ${{ inputs.quick_head }}
        run: python3 scripts/quick-check.py resolve --pr "$PR" --head "$QUICK_HEAD" --runner "$SMALL_RUNNER" --output quick-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quick-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: quick-request.json
          retention-days: 7

  quick_check:
    needs: quick_resolve
    if: ${{ needs.quick_resolve.outputs.runnable == 'true' }}
    runs-on:
      group: RiemannHypothesisBuild
      labels: ${{ needs.quick_resolve.outputs.runner_label }}
    timeout-minutes: 40
    env:
      QUICK_OUTPUT: ${{ github.workspace }}/.quick-results/rh-quick-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts
            lakefile.toml
            lake-manifest.json
            lean-toolchain
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.quick_resolve.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quick-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: quick-identity-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check changed modules within the small-runner budget
        env:
          SMALL_RUNNER: ${{ inputs.quick_runner }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          umask 077
          export PATH="$HOME/.elan/bin:$PATH"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if [[ ! -S "$XDG_RUNTIME_DIR/bus" ]]; then
            echo "The dedicated runner account has no systemd user bus at $XDG_RUNTIME_DIR/bus; check its user manager and loginctl linger setting." >&2
            exit 1
          fi
          systemd-run --user --wait --collect --pipe --unit="rh-quick-${RUN_ID}-${ATTEMPT}" \
            -p CPUQuota=800% -p MemoryMax=64G -p MemorySwapMax=0 -p TasksMax=16384 \
            -p LimitNOFILE=65536 -p LimitSTACK=infinity -p RuntimeMaxSec=1800 \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv="RUNNER_NAME=$RUNNER_NAME" \
            python3 "$PWD/trusted/scripts/quick-check.py" run --candidate "$PWD/candidate" \
            --request "$PWD/quick-identity-${RUN_ID}-${ATTEMPT}/quick-request.json" \
            --state "${RH_CI_STATE_DIR:-$HOME/.local/share/riemann-build-state}" \
            --runner "$SMALL_RUNNER" --output "$QUICK_OUTPUT"
      - name: Upload diagnostic result; this is not a full-build cache
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quick-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUICK_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
      - name: Explain the diagnostic scope
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          result=Path(os.environ['QUICK_OUTPUT'])/'result.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              print('Changed-module diagnostic only; a complete PR build remains required.',file=out)
              print('```json',file=out)
              print(result.read_text() if result.exists() else json.dumps({'status':'infrastructure_or_outer_budget_failure','full_build':False}),file=out)
              print('```',file=out)
          PYTHON

  # Build a list of Lake targets of one commit on a chosen runner, against the shared R2 cache:
  # restore (Mathlib, the nearest CI cache, the rh-buildq pool), `lake build`, and stage the
  # newly built modules as an artifact. The runner may be donor-owned: this job holds no cache
  # credentials, and everything that evaluates or runs the target commit's code runs in a
  # bubblewrap sandbox (fail closed). `fragment_publish` verifies and publishes the staged
  # modules from a GitHub-hosted runner. See scripts/rh-buildq/README.md.
  fragment:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'fragment' }}
    runs-on:
      group: RiemannHypothesisBuild
      labels: ${{ inputs.fragment_runner }}
    timeout-minutes: 1440
    permissions:
      contents: read
      actions: read  # the prune step reads the status of earlier fragment runs
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          # main's toolchain and dependency pins: the target must use exactly these.
          sparse-checkout: |
            scripts/rh-buildq
            lakefile.toml
            lake-manifest.json
            lean-toolchain
          sparse-checkout-cone-mode: false
      - name: Describe the host and remove trees of finished runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'FRAGMENT_TMP=%s\nFRAGMENT_STAGE=%s\n' "$RUNNER_TEMP/rh-fragment" "$RUNNER_TEMP/rh-fragment-stage" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rh-fragment"
          root="${RH_FRAGMENT_ROOT:-$HOME/rh-fragments}"
          mkdir -p "$root"
          echo "RH_FRAGMENT_ROOT=$root" >> "$GITHUB_ENV"
          python3 -I trusted/scripts/rh-buildq/fragment.py prune --root "$root" || true
          echo "runner $RUNNER_NAME, $(nproc) cpus, $(awk '/MemTotal/ {printf "%d GiB", $2/1048576}' /proc/meminfo)"
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release; uname -r
          df -h "$root" | tail -n 1
          for tool in git curl python3 bwrap elan; do printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo missing)"; done
      - name: Require the bubblewrap sandbox (no unsandboxed fallback)
        run: python3 -I trusted/scripts/rh-buildq/fragment.py probe --work "$RUNNER_TEMP/rh-fragment/probe"
      - name: Install elan if missing
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            d="$FRAGMENT_TMP/elan-install"; mkdir -p "$d"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$d/elan.tar.gz"
            printf '%s  %s\n' 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 "$d/elan.tar.gz" | sha256sum --check
            tar --extract --gzip --file "$d/elan.tar.gz" --directory "$d"
            "$d/elan-init" -y --default-toolchain none --no-modify-path
          fi
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve targets
        env:
          SPEC: ${{ inputs.fragment_targets }}
          COMMIT: ${{ inputs.fragment_commit }}
        run: |
          python3 -I trusted/scripts/rh-buildq/fragment.py targets "$SPEC" --out "$FRAGMENT_TMP/targets.txt"
          target="${COMMIT%% *}"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "fragment_commit must start with a 40-hex SHA"; exit 1; }
          # One tree per run: concurrent fragments of a commit never share one; reruns resume it.
          echo "FRAGMENT_QUEUE=$RH_FRAGMENT_ROOT/$target-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      # Trusted host code clones, checks that the target uses main's toolchain and dependency
      # manifest, prepares those dependencies (Mathlib's cache included) from main's own
      # configuration, and downloads maps and artifacts. Only `lake cache add` runs target code,
      # in the offline sandbox.
      - name: Restore Mathlib, the nearest CI cache and the rh-buildq pool
        env:
          COMMIT: ${{ inputs.fragment_commit }}
        run: |
          python3 -I trusted/scripts/rh-buildq/fragment.py restore --queue "$FRAGMENT_QUEUE" --commit "$COMMIT" \
            --trusted trusted --timings "$FRAGMENT_TMP/timings.json"
      - name: Build the targets in the offline sandbox
        env:
          JOBS: ${{ inputs.fragment_jobs }}
        run: |
          # exec: on cancellation the runner signals this process, which then stops the sandbox
          # before the stage step runs.
          exec python3 -I trusted/scripts/rh-buildq/fragment.py build --queue "$FRAGMENT_QUEUE" \
            --targets "$FRAGMENT_TMP/targets.txt" --log "$FRAGMENT_TMP/build.log" --jobs "${JOBS:-0}" \
            --timings "$FRAGMENT_TMP/timings.json"
      - name: Stage newly built modules, even after a failure
        id: stage
        if: ${{ always() }}
        run: |
          if [[ -n "${FRAGMENT_QUEUE:-}" ]]; then
            python3 -I trusted/scripts/rh-buildq/fragment.py stage --queue "$FRAGMENT_QUEUE" \
              --out "$FRAGMENT_STAGE" --timings "$FRAGMENT_TMP/timings.json"
            if [[ -f "$FRAGMENT_STAGE/manifest.json" ]]; then echo "staged=true" >> "$GITHUB_OUTPUT"; fi
          fi
      # One name per run: a rerun of this job replaces it, and a rerun of only the publisher
      # (a later run attempt) still finds it.
      - name: Upload the staged modules for the trusted publisher
        if: ${{ always() && steps.stage.outputs.staged == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fragment-cache-${{ github.run_id }}
          path: ${{ env.FRAGMENT_STAGE }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Summarize built and failed modules
        if: ${{ always() }}
        run: |
          if [[ -n "${FRAGMENT_QUEUE:-}" ]]; then
            python3 -I trusted/scripts/rh-buildq/fragment.py result --queue "$FRAGMENT_QUEUE" \
              --targets "$FRAGMENT_TMP/targets.txt" --log "$FRAGMENT_TMP/build.log" --stage "$FRAGMENT_STAGE" \
              --out "$FRAGMENT_TMP/result.json" --timings "$FRAGMENT_TMP/timings.json"
            gzip -kf "$FRAGMENT_TMP/build.log" 2>/dev/null || true
          fi
      - name: Upload the result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fragment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FRAGMENT_TMP }}/result.json
            ${{ env.FRAGMENT_TMP }}/build.log.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Remove scratch files
        if: ${{ always() }}
        run: rm -rf -- "$FRAGMENT_TMP" "$FRAGMENT_STAGE"
      - name: Remove the tree of a successful run
        if: ${{ success() }}
        run: rm -rf -- "$FRAGMENT_QUEUE"

  # The only job of the fragment mode that sees cache credentials: a fresh GitHub-hosted runner
  # that runs trusted code only. It verifies the staged modules against the target commit
  # (read as Git objects) before deriving the R2 keys, then publishes them. It runs after
  # failed or cancelled builds too, so their finished modules are not lost. The shared cache is
  # fully trusted by policy, so this runs unless the dispatcher sets fragment_publish=false;
  # see verification/CACHE.md.
  fragment_publish:
    needs: fragment
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'fragment' && inputs.fragment_publish && needs.fragment.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: ci-cache-publish
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/rh-buildq
      - name: Free hosted runner space for the staged modules
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Download the staged modules (untrusted data)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fragment-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/stage
      - name: Install pinned elan for content hashing
        if: ${{ steps.download.outcome == 'success' }}
        run: |
          mkdir "$RUNNER_TEMP/elan-install"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan-install/elan.tar.gz"
          printf '%s  %s\n' 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan-install/elan.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/elan-install/elan.tar.gz" --directory "$RUNNER_TEMP/elan-install"
          "$RUNNER_TEMP/elan-install/elan-init" -y --default-toolchain none --no-modify-path
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify the staged modules before any credential exists
        if: ${{ steps.download.outcome == 'success' }}
        env:
          COMMIT: ${{ inputs.fragment_commit }}
        run: |
          python3 -I trusted/scripts/rh-buildq/publish-fragment.py verify --stage "$RUNNER_TEMP/stage" \
            --commit "$COMMIT" --out "$RUNNER_TEMP/verified.json" --work "$RUNNER_TEMP/verify"
      - name: Publish the verified modules
        if: ${{ steps.download.outcome == 'success' }}
        env:
          R2_ACCOUNT_TOKEN: ${{ secrets.R2_ACCOUNT_TOKEN }}
        run: |
          umask 077
          python3 -I trusted/scripts/rh-buildq/publish-fragment.py credentials --out "$RUNNER_TEMP/secret/r2.json"
          python3 -I trusted/scripts/rh-buildq/publish-fragment.py publish --verified "$RUNNER_TEMP/verified.json" \
            --creds "$RUNNER_TEMP/secret/r2.json"
